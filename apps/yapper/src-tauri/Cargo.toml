[package]
name = "yapper-desktop"
version = "0.1.0"
description = "Yapper Windows-first desktop scaffold"
authors = ["OpenCode"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "yapper_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = [] }
yapper-app-api = { path = "../../../crates/yapper-app-api" }
