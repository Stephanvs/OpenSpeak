openapi: 3.1.0
info:
  title: Yapper TTS Server API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5100
paths:
  /v1/health:
    get:
      summary: Health and model readiness
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/models:
    get:
      summary: List available hosted models
      responses:
        '200':
          description: Available models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Model'
  /v1/synthesize:
    post:
      summary: Request synthesis job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
      responses:
        '200':
          description: Job accepted and stream location returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SynthesizeResponse'
        '404':
          description: Model not found
  /v1/audio/{request_id}:
    get:
      summary: Retrieve synthesized audio payload
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Audio response stream
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '404':
          description: Audio not found
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, models_loaded]
      properties:
        status:
          type: string
          enum: [ok]
        models_loaded:
          type: integer
    Model:
      type: object
      required: [id, name, language, backend, sample_rate_hz]
      properties:
        id:
          type: string
        name:
          type: string
        language:
          type: string
        backend:
          type: string
        sample_rate_hz:
          type: integer
    SynthesizeRequest:
      type: object
      required: [text, model_id, stream, format]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        model_id:
          type: string
        stream:
          type: boolean
        format:
          type: string
          enum: [wav, pcm_s16le]
    SynthesizeResponse:
      type: object
      required: [request_id, stream_url, format, sample_rate_hz]
      properties:
        request_id:
          type: string
        stream_url:
          type: string
        format:
          type: string
        sample_rate_hz:
          type: integer
