name: Release Yapper

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to release, for example v1.0.0
        required: true
        type: string
      draft:
        description: Create the GitHub release as a draft
        required: false
        default: false
        type: boolean
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: yapper-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: apps/yapper

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Derive release settings
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
            echo "YAPPER_RELEASE_DRAFT=${{ inputs.draft }}" >> "$GITHUB_ENV"
            if [ "${{ inputs.prerelease }}" = "true" ] || [[ "${{ inputs.release_tag }}" == *-* ]]; then
              echo "YAPPER_RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "YAPPER_RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "YAPPER_RELEASE_DRAFT=false" >> "$GITHUB_ENV"
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              echo "YAPPER_RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            else
              echo "YAPPER_RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/yapper/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm clang zlib1g-dev

      - name: Verify tag matches package version
        run: node -e "const pkg = require('./package.json'); const expected = `v${pkg.version}`; if (process.env.RELEASE_TAG !== expected) { console.error(`Expected release tag ${expected} but got ${process.env.RELEASE_TAG}`); process.exit(1); }"

      - name: Install dependencies
        run: npm ci

      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
