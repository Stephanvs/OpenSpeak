name: Release

on:
  push:
    branches: [main]
    paths: &release-paths
      - 'apps/openspeak/**'
      - 'cliff.toml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'web/public/install'
      - 'web/public/install.ps1'
  pull_request:
    paths: *release-paths
  workflow_dispatch:

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2
      - name: Decide the release
        id: plan
        env:
          ON_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          head_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [[ -n "$head_tag" ]]; then
            tag=$head_tag
            releasable=true
            git cliff --latest --strip all > notes.md
          else
            tag=$(git cliff --bumped-version)
            commits=$(git cliff --unreleased --context | jq '.[0].commits // [] | length')
            releasable=$([[ "$commits" -gt 0 ]] && echo true || echo false)
            git cliff --unreleased --tag "$tag" --strip all > notes.md
          fi
          publish=$([[ "$releasable" == true && "$ON_MAIN" == true ]] && echo true || echo false)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          { echo "### $tag (publish: $publish)"; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: notes
          path: notes.md

  build:
    needs: plan
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { target: x86_64-apple-darwin, os: macos-15-intel, archive: tar.gz }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, archive: tar.gz }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, archive: tar.gz }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    defaults:
      run:
        shell: bash
        working-directory: apps/openspeak
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.target }}
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Stamp the release version
        run: perl -0pi -e "s/^version = \"[^\"]*\"/version = \"$VERSION\"/m" Cargo.toml
      - name: Build
        run: cargo build --release --target "$TARGET"
      - name: Check the binary reports the release version
        run: |
          actual=$("target/$TARGET/release/openspeak" --version)
          [[ "$actual" == "openspeak $VERSION" ]] || { echo "expected 'openspeak $VERSION', got '$actual'"; exit 1; }
      - name: Package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd "target/$TARGET/release"
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a -tzip "$GITHUB_WORKSPACE/dist/openspeak-$TARGET.zip" openspeak.exe
          else
            tar -czf "$GITHUB_WORKSPACE/dist/openspeak-$TARGET.tar.gz" openspeak
          fi
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  package:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Render the Homebrew formula and Scoop manifest
        run: bash .github/scripts/render-packages.sh "${{ needs.plan.outputs.version }}" dist packages
      - run: cat packages/openspeak.rb packages/openspeak.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: packages/*

  github-release:
    needs: [plan, package]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: '{dist-*,notes}'
          path: dist
          merge-multiple: true
      - name: Create or refresh the GitHub release
        run: |
          mv dist/notes.md notes.md
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md
          fi

  homebrew:
    needs: [plan, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/checkout@v7.0.1
        with:
          repository: Stephanvs/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Push the formula
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../packages/openspeak.rb Formula/openspeak.rb
          git add Formula/openspeak.rb
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "openspeak ${{ needs.plan.outputs.version }}"
          git push

  scoop:
    needs: [plan, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/checkout@v7.0.1
        with:
          repository: Stephanvs/scoop-bucket
          ssh-key: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
          path: bucket
      - name: Push the manifest
        working-directory: bucket
        run: |
          cp ../packages/openspeak.json openspeak.json
          git add openspeak.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "openspeak: Update to version ${{ needs.plan.outputs.version }}"
          git push

  verify-homebrew:
    needs: [plan, homebrew]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew and the system ALSA library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2t64
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install from the tap
        run: |
          brew install stephanvs/tap/openspeak
          actual=$(openspeak --version)
          [[ "$actual" == "openspeak ${{ needs.plan.outputs.version }}" ]] || { echo "brew installed '$actual'"; exit 1; }
          brew test stephanvs/tap/openspeak

  verify-scoop:
    needs: [plan, scoop]
    runs-on: windows-latest
    steps:
      - name: Install from the bucket
        shell: pwsh
        run: |
          Invoke-Expression "& {$(Invoke-RestMethod get.scoop.sh)} -RunAsAdmin"
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add stephanvs https://github.com/Stephanvs/scoop-bucket
          scoop install stephanvs/openspeak
          $actual = openspeak --version
          if ($actual -ne "openspeak ${{ needs.plan.outputs.version }}") { throw "scoop installed '$actual'" }

  verify-install-scripts:
    needs: [plan, github-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED: openspeak ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: web/public
      - name: Install with install
        if: runner.os != 'Windows'
        run: |
          [[ "$RUNNER_OS" == Linux ]] && sudo apt-get update && sudo apt-get install -y libasound2
          OPENSPEAK_INSTALL_DIR="$RUNNER_TEMP/bin" sh web/public/install
          actual=$("$RUNNER_TEMP/bin/openspeak" --version)
          [[ "$actual" == "$EXPECTED" ]] || { echo "install.sh installed '$actual'"; exit 1; }
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:OPENSPEAK_INSTALL_DIR = "$env:RUNNER_TEMP\bin"
          ./web/public/install.ps1
          $actual = & "$env:RUNNER_TEMP\bin\openspeak.exe" --version
          if ($actual -ne $env:EXPECTED) { throw "install.ps1 installed '$actual'" }
