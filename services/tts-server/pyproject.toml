[project]
name = "yapper-tts-server"
version = "0.1.0"
description = "Yapper TTS server and CLI"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0"
]

[project.scripts]
yapper-server = "src.cli:app"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
